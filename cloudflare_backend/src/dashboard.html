<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALittle · 玩家行为数据看板</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161a21; --panel2:#1c222b; --line:#262e3a;
    --text:#e6ebf2; --dim:#8b98a8; --accent:#4da3ff;
    --red:#ff4757; --blue:#4da3ff; --orange:#ffa940; --green:#40d68f; --purple:#aa78ff; --pink:#ff6eb4;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,select,input{font:inherit;color:inherit}
  button{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:5px 11px; border-radius:6px; cursor:pointer;
  }
  button:hover{border-color:#3a4757; background:#222a35}
  button.primary{background:#1d3a5c; border-color:#2c5585; color:#cfe6ff}
  button.primary:hover{background:#24476f}
  select,input[type=text],input[type=number]{
    background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:5px 8px;
  }
  header{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px;
    padding:10px 18px; background:rgba(14,17,22,.92); border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px); flex-wrap:wrap;
  }
  header h1{margin:0; font-size:15px; font-weight:600; letter-spacing:.3px; white-space:nowrap}
  header h1 span{color:var(--dim); font-weight:400; margin-left:6px}
  header .spacer{flex:1}
  .status{color:var(--dim); font-size:12px; white-space:nowrap}
  .status.bad{color:var(--red)}
  main{display:flex; align-items:flex-start; gap:14px; padding:14px 18px 60px}
  aside{
    width:236px; flex:0 0 236px; position:sticky; top:58px; max-height:calc(100vh - 80px);
    overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px;
  }
  aside h2{margin:6px 6px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim)}
  .lvl{
    display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent;
    border-radius:8px; padding:7px 8px; cursor:pointer; margin-bottom:2px;
  }
  .lvl:hover{background:var(--panel2)}
  .lvl.on{background:#1b2a3d; border-color:#2c5585}
  .lvl .nm{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
  .lvl .nm b{font-weight:600; font-size:13px}
  .lvl .nm em{font-style:normal; color:var(--dim); font-size:11px}
  .lvl .sub{color:var(--dim); font-size:11px; margin-top:2px; display:flex; gap:8px; flex-wrap:wrap}
  .lvl .sub .hot{color:#ff8b96}
  .panel{flex:1; min-width:0; display:flex; flex-direction:column; gap:12px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
  .card h3{margin:0 0 10px; font-size:13px; font-weight:600}
  .card h3 small{color:var(--dim); font-weight:400; margin-left:8px}
  .tabs{display:flex; gap:6px; flex-wrap:wrap}
  .tab{
    background:transparent; border:1px solid transparent; color:var(--dim);
    padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .tab:hover{color:var(--text); background:var(--panel2)}
  .tab.on{background:#1b2a3d; border-color:#2c5585; color:#cfe6ff}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
  .kpi .v{font-size:20px; font-weight:600; letter-spacing:.3px}
  .kpi .l{color:var(--dim); font-size:11px; margin-top:1px}
  .kpi .u{color:var(--dim); font-size:11px; font-weight:400; margin-left:2px}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
  .toolbar .sep{width:1px; height:18px; background:var(--line); margin:0 2px}
  .seg{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
  .seg button{border:0; border-radius:0; background:transparent; padding:5px 11px; color:var(--dim)}
  .seg button.on{background:#22304a; color:#cfe6ff}
  .heatwrap{position:relative; display:flex; justify-content:center}
  canvas{display:block; border-radius:8px; background:#0b0e12; cursor:crosshair}
  .tip{
    position:absolute; pointer-events:none; background:rgba(12,16,22,.96); border:1px solid #33404f;
    border-radius:8px; padding:8px 10px; font-size:12px; line-height:1.6; min-width:130px;
    box-shadow:0 8px 24px rgba(0,0,0,.5); display:none; z-index:10;
  }
  .tip b{color:#fff}
  .tip .k{color:var(--dim)}
  .legend{display:flex; align-items:center; gap:8px; color:var(--dim); font-size:11px; margin-top:10px}
  .legend .bar{height:8px; width:170px; border-radius:4px; border:1px solid var(--line)}
  table{width:100%; border-collapse:collapse; font-size:12px}
  th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap}
  th{color:var(--dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.05em}
  tbody tr:hover{background:var(--panel2)}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  .scroll{max-height:380px; overflow:auto; border:1px solid var(--line); border-radius:8px}
  .scroll table th{position:sticky; top:0; background:var(--panel2); z-index:1}
  .bar-cell{position:relative; min-width:120px}
  .bar-cell .fill{position:absolute; left:0; top:2px; bottom:2px; background:#2b4a6f; border-radius:3px; z-index:0}
  .bar-cell span{position:relative; z-index:1; padding-left:4px}
  .badge{display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; background:#243040; color:#a9bdd6}
  .badge.death{background:#401a20; color:#ff8b96}
  .badge.clear{background:#14372a; color:#63e0a6}
  .badge.quit{background:#3a2a14; color:#ffc078}
  .badge.start{background:#1b2a3d; color:#8fc2ff}
  .badge.session{background:#2a2140; color:#b79bff}
  .muted{color:var(--dim)}
  .empty{padding:26px 10px; text-align:center; color:var(--dim); line-height:1.9}
  .empty code{background:var(--panel2); padding:2px 6px; border-radius:4px; color:#b8c8dc}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media (max-width:1000px){ .grid2{grid-template-columns:1fr} }
  @media (max-width:860px){
    main{flex-direction:column}
    aside{position:static; width:100%; flex:none; max-height:220px}
  }
  .dict h4{margin:14px 0 6px; font-size:12px; color:#a9bdd6}
  .dict table{font-size:11.5px}
  .dict td:first-child{color:#8fc2ff; font-family:ui-monospace,Consolas,monospace}
  details summary{cursor:pointer; color:var(--dim)}
  .hint{font-size:11.5px; color:var(--dim); margin-top:8px}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:1px}
</style>
</head>
<body>
<header>
  <h1>ALittle<span>玩家行为数据看板</span></h1>
  <div class="row" style="gap:8px">
    <select id="range" title="只看这段时间的数据">
      <option value="all">全部时间</option>
      <option value="24h">最近 24 小时</option>
      <option value="7d">最近 7 天</option>
      <option value="30d">最近 30 天</option>
    </select>
    <button id="refresh" class="primary">刷新</button>
    <label class="muted" style="font-size:12px;display:flex;align-items:center;gap:5px">
      <input type="checkbox" id="auto" style="accent-color:#4da3ff"> 自动刷新
    </label>
  </div>
  <div class="spacer"></div>
  <span class="status" id="status">就绪</span>
  <button id="cfgBtn" title="连接设置">⚙</button>
</header>

<div id="cfg" class="card" style="display:none;margin:12px 18px 0">
  <div class="row">
    <label class="muted">API 地址 <input type="text" id="cfgApi" size="46" spellcheck="false"></label>
    <label class="muted">只读密钥 <input type="text" id="cfgKey" size="20" spellcheck="false" placeholder="没配就留空"></label>
    <button id="cfgSave" class="primary">保存</button>
    <span class="hint">从游戏内打开时不用改；直接双击 HTML 打开文件时才需要填 Worker 地址。</span>
  </div>
</div>

<main>
  <aside>
    <h2>关卡（按死亡排序）</h2>
    <div id="levels"><div class="muted" style="padding:8px">加载中…</div></div>
  </aside>
  <div class="panel">
    <div class="tabs" id="tabs"></div>
    <div id="kpis" class="kpis"></div>
    <div id="content"></div>
  </div>
</main>

<script>
"use strict";

/* ---------------------------------------------------------------- 状态 */

const FALLBACK_API = "https://alittle-telemetry.lhy060303.workers.dev";
const qs = new URLSearchParams(location.search);
const servedFromHttp = location.protocol === "http:" || location.protocol === "https:";

const state = {
  api: servedFromHttp ? location.origin : (qs.get("api") || localStorage.getItem("alittle_api") || FALLBACK_API),
  key: qs.get("key") || localStorage.getItem("alittle_key") || "",
  range: qs.get("range") || "all",
  scene: qs.get("scene") || null,
  metric: qs.get("metric") || "deaths",
  tab: ["heatmap","compare","deaths","runs","recent","dict"].includes(qs.get("tab")) ? qs.get("tab") : "heatmap",
  overview: null,
  sceneData: null,
  transform: null,
  bg: null,
  bgBounds: null,
  showBg: true,
  showGrid: true,
  autoTimer: null,
  recent: null,
};

const METRICS = {
  deaths:  { label:"死亡次数", rgb:[255,71,87],  get:c=>c.deaths,  fmt:v=>v+" 次" },
  jumps:   { label:"跳跃次数", rgb:[77,163,255], get:c=>c.jumps,   fmt:v=>v+" 次" },
  fails:   { label:"跳跃失败", rgb:[255,169,64], get:c=>c.fails,   fmt:v=>v+" 次" },
  dwell:   { label:"停留时长", rgb:[64,214,143], get:c=>c.dwell,   fmt:v=>v.toFixed(1)+" 秒" },
  idle:    { label:"发呆时长", rgb:[170,120,255],get:c=>c.idle,    fmt:v=>v.toFixed(1)+" 秒" },
  failrate:{ label:"跳跃失败率", rgb:[255,110,180], get:c=>c.fail_rate||0, fmt:v=>(v*100).toFixed(0)+"%" },
};

/* ---------------------------------------------------------------- 小工具 */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s === null || s === undefined ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmtNum = (v) => {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  if (Math.abs(v) >= 10000) return (v/1000).toFixed(1) + "k";
  return (Math.round(v*10)/10).toString();
};
const fmtPct = (v) => (v === null || v === undefined ? "–" : (v*100).toFixed(1) + "%");
const fmtSec = (s) => {
  if (s === null || s === undefined) return "–";
  if (s < 60) return s.toFixed(1) + "s";
  const m = Math.floor(s/60), r = Math.round(s%60);
  if (m < 60) return m + "m" + String(r).padStart(2,"0") + "s";
  return Math.floor(m/60) + "h" + String(m%60).padStart(2,"0") + "m";
};
const fmtTime = (ts) => {
  if (!ts) return "–";
  const d = new Date(ts);
  const p = (n) => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const fmtAgo = (ts) => {
  const s = Math.max(0, (Date.now() - ts)/1000);
  if (s < 60) return Math.floor(s) + " 秒前";
  if (s < 3600) return Math.floor(s/60) + " 分钟前";
  if (s < 86400) return Math.floor(s/3600) + " 小时前";
  return Math.floor(s/86400) + " 天前";
};

function setStatus(text, bad) {
  const el = $("status");
  el.textContent = text;
  el.className = "status" + (bad ? " bad" : "");
}

function sinceMs() {
  if (state.range === "all") return 0;
  const hours = { "24h":24, "7d":24*7, "30d":24*30 }[state.range];
  return hours ? Date.now() - hours*3600*1000 : 0;
}

async function api(path, params) {
  const u = new URL(path, state.api);
  for (const k in (params||{})) {
    const v = params[k];
    if (v !== undefined && v !== null) u.searchParams.set(k, v);
  }
  if (state.key) u.searchParams.set("key", state.key);
  const res = await fetch(u.toString(), { cache: "no-store" });
  let body;
  try { body = await res.json(); } catch { body = { ok:false, error:"返回不是 JSON" }; }
  if (!res.ok || body.ok === false) {
    throw new Error(body.error || ("HTTP " + res.status));
  }
  return body;
}

/* ---------------------------------------------------------------- 加载 */

async function loadAll() {
  setStatus("加载中…");
  try {
    const since = sinceMs();
    const ov = await api("/v1/stats/overview", { since });
    state.overview = ov;

    if (!state.scene && ov.scenes.length) {
      state.scene = pickDefaultScene(ov.scenes);
    }
    state.sceneData = state.scene ? await api("/v1/stats/scene", { scene: state.scene, since }) : null;
    state.recent = null;

    renderLevels();
    renderKpis();
    renderTabs();
    renderContent();
    setStatus("更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12:false }));
  } catch (err) {
    setStatus("出错：" + err.message, true);
    $("content").innerHTML = `<div class="card"><div class="empty">
      读不到数据：${esc(err.message)}<br>
      <span class="muted">检查网络、API 地址和只读密钥（⚙ 里改）</span>
    </div></div>`;
  }
}

function pickDefaultScene(scenes) {
  const scored = scenes.slice().sort((a,b) => (b.deaths - a.deaths) || (b.starts - a.starts));
  return (scored[0] || scenes[0]).scene;
}

/* ---------------------------------------------------------------- 左侧关卡列表 */

function renderLevels() {
  const ov = state.overview;
  const box = $("levels");
  if (!ov || !ov.scenes.length) {
    box.innerHTML = `<div class="empty" style="padding:14px 8px">还没有任何关卡数据</div>`;
    return;
  }
  const sorted = ov.scenes.slice().sort((a,b) => (b.deaths - a.deaths) || (b.starts - a.starts));
  const maxDeaths = Math.max(1, ...sorted.map(s => s.deaths));

  box.innerHTML = sorted.map(s => {
    const on = s.scene === state.scene ? " on" : "";
    const heat = s.deaths / maxDeaths;
    const dotColor = heat > 0.66 ? "#ff4757" : heat > 0.25 ? "#ffa940" : "#3a4757";
    return `<button class="lvl${on}" data-scene="${esc(s.scene)}">
      <span class="nm"><b>${esc(s.scene)}</b><em>${s.level_index === null ? "" : "#" + s.level_index}</em></span>
      <span class="sub">
        <span><i class="dot" style="background:${dotColor}"></i>死 ${s.deaths}</span>
        <span>进入 ${s.starts}</span>
        <span>通关 ${fmtPct(s.clear_rate)}</span>
      </span>
    </button>`;
  }).join("");

  box.querySelectorAll(".lvl").forEach(el => {
    el.addEventListener("click", async () => {
      state.scene = el.dataset.scene;
      syncUrl();
      renderLevels();
      await loadScene();
      renderKpis();
      renderContent();
    });
  });
}

async function loadScene() {
  try {
    const since = sinceMs();
    state.sceneData = await api("/v1/stats/scene", { scene: state.scene, since });
  } catch (err) {
    state.sceneData = null;
    setStatus("关卡数据出错：" + err.message, true);
  }
}

/* ---------------------------------------------------------------- KPI */

function renderKpis() {
  const ov = state.overview;
  const sd = state.sceneData;
  const t = ov ? ov.totals : null;
  const items = [];

  if (t) {
    items.push([fmtNum(t.deaths), "总死亡", ""]);
    items.push([fmtNum(t.jumps), "总跳跃", ""]);
    items.push([fmtNum(t.players), "玩家数", ""]);
    items.push([fmtNum(t.sessions), "游玩局数", ""]);
    items.push([fmtSec(t.playtime_s), "累计游戏时长", ""]);
  }
  if (sd && sd.stats) {
    items.push([fmtNum(sd.stats.starts), `「${sd.scene}」进入`, ""]);
    items.push([fmtNum(sd.stats.deaths), "本关死亡", ""]);
    items.push([fmtPct(sd.stats.clear_rate), "本关通关率", ""]);
    items.push([fmtSec(sd.stats.avg_duration_s), "平均单次时长", ""]);
    items.push([fmtNum(sd.stats.cells), "有记录的格子", ""]);
  }

  $("kpis").innerHTML = items.map(([v,l]) =>
    `<div class="kpi"><div class="v">${esc(v)}</div><div class="l">${esc(l)}</div></div>`
  ).join("");
}

/* ---------------------------------------------------------------- 标签页 */

const TABS = [
  ["heatmap", "热力图"],
  ["compare", "关卡对比"],
  ["deaths", "死亡"],
  ["runs", "时长与通关"],
  ["recent", "最近事件"],
  ["dict", "数据字典"],
];

function renderTabs() {
  $("tabs").innerHTML = TABS.map(([k, label]) =>
    `<button class="tab${state.tab === k ? " on" : ""}" data-tab="${k}">${label}</button>`
  ).join("");
  $("tabs").querySelectorAll(".tab").forEach(el => {
    el.addEventListener("click", () => {
      state.tab = el.dataset.tab;
      syncUrl();
      renderTabs();
      renderContent();
    });
  });
}

function renderContent() {
  const c = $("content");
  if (state.tab === "heatmap") { c.innerHTML = viewHeatmap(); bindHeatmap(); return; }
  if (state.tab === "compare") { c.innerHTML = viewCompare(); return; }
  if (state.tab === "deaths") { c.innerHTML = viewDeaths(); return; }
  if (state.tab === "runs") { c.innerHTML = viewRuns(); return; }
  if (state.tab === "recent") { viewRecent(); return; }
  if (state.tab === "dict") { c.innerHTML = viewDict(); return; }
}

/* ---------------------------------------------------------------- 热力图 */

function viewHeatmap() {
  const sd = state.sceneData;
  if (!sd || !sd.cells || !sd.cells.length) {
    return `<div class="card"><div class="empty">
      这一关还没有格子数据。<br>
      <span class="muted">热力图来自 <code>cell</code> 事件：玩家每走一步都会在 1×1 的格子里累加停留时间，<br>
      每 60 秒或关卡结束时上报一次增量。跑一局就有了。</span>
    </div></div>`;
  }

  const b = sd.bounds;
  return `
  <div class="card">
    <div class="toolbar">
      <div class="seg" id="metricSeg">
        ${Object.keys(METRICS).map(k =>
          `<button data-metric="${k}" class="${state.metric===k?"on":""}">${METRICS[k].label}</button>`
        ).join("")}
      </div>
      <div class="sep"></div>
      <label class="muted" style="font-size:12px;display:flex;align-items:center;gap:5px">
        <input type="checkbox" id="gridChk" ${state.showGrid?"checked":""} style="accent-color:#4da3ff"> 网格
      </label>
      <div class="sep"></div>
      <label class="muted" style="font-size:12px">背景图
        <input type="file" id="bgFile" accept="image/*" style="max-width:150px;font-size:11px">
      </label>
      <label class="muted" style="font-size:12px;display:flex;align-items:center;gap:5px">
        <input type="checkbox" id="bgChk" ${state.showBg?"checked":""} style="accent-color:#4da3ff"> 显示
      </label>
      <button id="bgFit" title="让背景图自动铺满数据范围">铺满</button>
    </div>
    <div class="heatwrap">
      <canvas id="heat"></canvas>
      <div class="tip" id="tip"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="hint">
      坐标是 Unity 世界坐标，1 格 = 1 个世界单位。颜色越亮表示该指标数值越大；把鼠标放到格子上看全部数值。
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>最热的格子 <small id="topLabel"></small></h3>
      <div class="scroll"><table id="topCells"></table></div>
    </div>
    <div class="card">
      <h3>本关概况</h3>
      <table>
        <tbody>
          <tr><td class="muted">进入次数</td><td class="num">${fmtNum(sd.stats.starts)}</td></tr>
          <tr><td class="muted">通关 / 放弃</td><td class="num">${fmtNum(sd.stats.clears)} / ${fmtNum(sd.stats.quits)}</td></tr>
          <tr><td class="muted">平均单次时长</td><td class="num">${fmtSec(sd.stats.avg_duration_s)}</td></tr>
          <tr><td class="muted">死亡总数</td><td class="num">${fmtNum(sd.stats.deaths)}</td></tr>
          <tr><td class="muted">跳跃 / 跳跃失败</td><td class="num">${fmtNum(sd.stats.jumps)} / ${fmtNum(sd.stats.jump_fails)}</td></tr>
          <tr><td class="muted">有记录的格子</td><td class="num">${fmtNum(sd.stats.cells)}</td></tr>
          <tr><td class="muted">范围</td><td class="num">x ${b.minX}~${b.maxX} · y ${b.minY}~${b.maxY}</td></tr>
        </tbody>
      </table>
    </div>
  </div>`;
}

function bindHeatmap() {
  const sd = state.sceneData;
  if (!sd || state.tab !== "heatmap") return;
  const canvas = $("heat");
  if (!canvas) return;

  canvas.addEventListener("mousemove", onHeatMove);
  canvas.addEventListener("mouseleave", () => { $("tip").style.display = "none"; });

  $("metricSeg").querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      state.metric = btn.dataset.metric;
      syncUrl();
      $("metricSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.metric === state.metric));
      drawHeatmap();
      renderTopCells();
    });
  });

  $("gridChk").addEventListener("change", (e) => { state.showGrid = e.target.checked; drawHeatmap(); });
  $("bgChk").addEventListener("change", (e) => { state.showBg = e.target.checked; drawHeatmap(); });
  $("bgFit").addEventListener("click", () => {
    state.bgBounds = { minX: sd.bounds.minX - 0.5, maxX: sd.bounds.maxX + 1.5, minY: sd.bounds.minY - 0.5, maxY: sd.bounds.maxY + 1.5 };
    drawHeatmap();
  });

  $("bgFile").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => {
      state.bg = img;
      state.showBg = true;
      $("bgChk").checked = true;
      // 默认把图的中心对准数据范围中心，宽度按数据范围铺满
      const b = sd.bounds;
      state.bgBounds = { minX: b.minX - 0.5, maxX: b.maxX + 1.5, minY: b.minY - 0.5, maxY: b.maxY + 1.5 };
      drawHeatmap();
    };
    img.src = URL.createObjectURL(f);
  });

  fitCanvas();
  renderTopCells();
  if (!state._resizeBound) {
    state._resizeBound = true;
    window.addEventListener("resize", fitCanvas);
  }
}

function fitCanvas() {
  const canvas = $("heat");
  if (!canvas) return;
  const wrap = canvas.parentElement;
  const w = Math.max(320, wrap.clientWidth);
  const dpr = window.devicePixelRatio || 1;
  const sd = state.sceneData;
  let h = 420;
  if (sd && sd.bounds && sd.bounds.width > 0) {
    h = Math.min(560, Math.max(300, w * (sd.bounds.height / sd.bounds.width)));
  }
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  state.view = { w, h };
  drawHeatmap();
}

function drawHeatmap() {
  const canvas = $("heat");
  const sd = state.sceneData;
  if (!canvas || !sd || !sd.bounds || !state.view) return;
  const ctx = canvas.getContext("2d");
  const { w, h } = state.view;
  const b = sd.bounds;

  ctx.clearRect(0, 0, w, h);

  const pad = 14;
  const cols = Math.max(1, b.width), rows = Math.max(1, b.height);
  const cellPx = Math.max(2, Math.min((w - pad*2)/cols, (h - pad*2)/rows));
  const gridW = cellPx*cols, gridH = cellPx*rows;
  const ox = pad + (w - pad*2 - gridW)/2;
  const oy = pad + (h - pad*2 - gridH)/2;
  const x2px = (x) => ox + (x - b.minX) * cellPx;
  const y2px = (y) => oy + (b.maxY - y) * cellPx;
  state.transform = { ox, oy, cellPx, b };

  // 背景图
  if (state.showBg && state.bg && state.bgBounds) {
    const bb = state.bgBounds;
    const bx = x2px(bb.minX), by = y2px(bb.maxY);
    const bw = (bb.maxX - bb.minX) * cellPx, bh = (bb.maxY - bb.minY) * cellPx;
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.drawImage(state.bg, bx, by, bw, bh);
    ctx.restore();
  }

  const m = METRICS[state.metric];
  const values = sd.cells.map(m.get);
  const max = Math.max(state.metric === "failrate" ? 0.0001 : 1, ...values);
  const useSqrt = state.metric !== "failrate";

  for (const c of sd.cells) {
    const v = m.get(c);
    if (!v) continue;
    let t = v / max;
    if (useSqrt) t = Math.sqrt(t);
    const [r, g, bl] = m.rgb;
    ctx.fillStyle = `rgba(${r},${g},${bl},${(0.12 + 0.88*t).toFixed(3)})`;
    ctx.fillRect(x2px(c.x), y2px(c.y), Math.max(1, cellPx - 0.4), Math.max(1, cellPx - 0.4));
  }

  // 网格
  if (state.showGrid && cellPx >= 7) {
    ctx.strokeStyle = "rgba(255,255,255,.06)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= cols; i++) {
      const x = Math.round(ox + i*cellPx) + 0.5;
      ctx.moveTo(x, oy); ctx.lineTo(x, oy + gridH);
    }
    for (let j = 0; j <= rows; j++) {
      const y = Math.round(oy + j*cellPx) + 0.5;
      ctx.moveTo(ox, y); ctx.lineTo(ox + gridW, y);
    }
    ctx.stroke();
  }

  // 边框
  ctx.strokeStyle = "rgba(255,255,255,.18)";
  ctx.strokeRect(ox + 0.5, oy + 0.5, gridW, gridH);

  // 坐标标注
  ctx.fillStyle = "rgba(230,235,242,.45)";
  ctx.font = "11px ui-monospace,Consolas,monospace";
  ctx.fillText(`x ${b.minX} → ${b.maxX}`, ox, oy + gridH + 14);
  ctx.fillText(`y ${b.maxY} → ${b.minY}`, ox, oy - 4);

  renderLegend(max, m);
}

function renderLegend(max, m) {
  const el = $("legend");
  if (!el) return;
  const [r, g, b] = m.rgb;
  el.innerHTML = `
    <span>0</span>
    <span class="bar" style="background:linear-gradient(90deg, rgba(${r},${g},${b},.12), rgba(${r},${g},${b},1))"></span>
    <span>${esc(m.fmt(max))}</span>
    <span class="muted" style="margin-left:6px">${esc(m.label)}（每格汇总）</span>`;
}

function onHeatMove(ev) {
  const canvas = $("heat");
  const tip = $("tip");
  const sd = state.sceneData;
  const tr = state.transform;
  if (!tr) return;

  const rect = canvas.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const gx = tr.b.minX + Math.floor((mx - tr.ox) / tr.cellPx);
  const gy = tr.b.maxY - Math.floor((my - tr.oy) / tr.cellPx);

  const cell = sd.cells.find(c => c.x === gx && c.y === gy);
  if (!cell) { tip.style.display = "none"; return; }

  tip.innerHTML = `
    <div><b>(${cell.x}, ${cell.y})</b> <span class="k">格子</span></div>
    <div><span class="k">死亡</span> ${cell.deaths} ${cell.causes && cell.causes.length ? "· " + esc(cell.causes.join(", ")) : ""}</div>
    <div><span class="k">跳跃</span> ${cell.jumps} · <span class="k">失败</span> ${cell.fails} ${cell.fail_rate !== null ? "(" + fmtPct(cell.fail_rate) + ")" : ""}</div>
    <div><span class="k">停留</span> ${cell.dwell.toFixed(1)}s · <span class="k">发呆</span> ${cell.idle.toFixed(1)}s</div>`;
  tip.style.display = "block";

  const wrap = canvas.parentElement.getBoundingClientRect();
  let left = ev.clientX - wrap.left + 14;
  let top = ev.clientY - wrap.top + 14;
  if (left + tip.offsetWidth > wrap.width - 6) left = ev.clientX - wrap.left - tip.offsetWidth - 14;
  if (top + tip.offsetHeight > wrap.height - 6) top = ev.clientY - wrap.top - tip.offsetHeight - 14;
  tip.style.left = Math.max(4, left) + "px";
  tip.style.top = Math.max(4, top) + "px";
}

function renderTopCells() {
  const table = $("topCells");
  const sd = state.sceneData;
  if (!table || !sd) return;
  const m = METRICS[state.metric];
  $("topLabel").textContent = "按" + m.label;

  const rows = sd.cells.slice()
    .sort((a, b) => m.get(b) - m.get(a))
    .slice(0, 15);

  table.innerHTML = `
    <thead><tr>
      <th>格子</th><th class="num">${esc(m.label)}</th>
      <th class="num">死亡</th><th class="num">跳跃</th><th class="num">停留</th>
    </tr></thead>
    <tbody>${rows.map(c => `
      <tr>
        <td>(${c.x}, ${c.y})</td>
        <td class="num">${esc(m.fmt(m.get(c)))}</td>
        <td class="num">${c.deaths || ""}</td>
        <td class="num">${c.jumps || ""}</td>
        <td class="num">${c.dwell ? c.dwell.toFixed(1) : ""}</td>
      </tr>`).join("")}
    </tbody>`;
}

    <div class="card">

function bars(pairs) {
  if (!pairs.length) return `<div class="muted" style="padding:8px 0">暂无数据</div>`;
  const max = Math.max(1, ...pairs.map(p => p[1]));
  return `<table><tbody>${pairs.map(([label, n]) => `
    <tr>
      <td style="width:34%">${esc(label)}</td>
      <td class="bar-cell"><div class="fill" style="width:${Math.round(n/max*100)}%"></div><span>${fmtNum(n)}</span></td>
    </tr>`).join("")}</tbody></table>`;
}

/* ---------------------------------------------------------------- 死亡 */

function viewDeaths() {
  const sd = state.sceneData;
  if (!sd) return `<div class="card"><div class="empty">先选一关</div></div>`;

  const causes = {};
  for (const d of sd.deaths) causes[d.cause] = (causes[d.cause] || 0) + 1;
  const causePairs = Object.keys(causes).map(k => [k, causes[k]]).sort((a,b) => b[1]-a[1]);

  const hotspots = sd.cells.filter(c => c.deaths > 0).sort((a,b) => b.deaths - a.deaths).slice(0, 10);
  const maxHot = Math.max(1, ...hotspots.map(h => h.deaths));

  return `
  <div class="grid2">
    <div class="card">
      <h3>本关死因</h3>
      ${bars(causePairs)}
    </div>
    <div class="card">
      <h3>死亡最集中的格子</h3>
      ${hotspots.length ? `<table><tbody>${hotspots.map(h => `
        <tr>
          <td>(${h.x}, ${h.y})</td>
          <td class="bar-cell"><div class="fill" style="width:${Math.round(h.deaths/maxHot*100)}%"></div><span>${h.deaths} 次</span></td>
          <td class="muted" style="font-size:11px">${esc((h.causes||[]).join(", "))}</td>

  <div class="card">

    ${sd.deaths.length ? `<div class="scroll"><table>
      <thead><tr>
        <th>时间</th><th>死因</th><th>角色</th><th class="num">位置</th>
        <th class="num">活了</th><th class="num">死前跳跃</th><th class="num">本关第几次死</th>
      </tr></thead>
      <tbody>${sd.deaths.map(d => `

/* ---------------------------------------------------------------- 时长与通关 */

function viewRuns() {
  const sd = state.sceneData;
  if (!sd) return `<div class="card"><div class="empty">先选一关</div></div>`;
  const runs = sd.runs || [];
  if (!runs.length) {
    return `<div class="card"><div class="empty">
      还没有「关卡结束」记录。<br><span class="muted">通关或被中断时会发一条 <code>level_clear</code> / <code>level_quit</code>。</span>
    </div></div>`;
  }

  const buckets = histogram(runs.map(r => r.duration_s), 12);
  const maxCount = Math.max(1, ...buckets.map(b => b.count));
  const clears = runs.filter(r => r.type === "level_clear").length;

  return `
  <div class="card">
    <h3>单次游玩时长分布 <small>${runs.length} 次记录 · 通关 ${clears} 次</small></h3>
    <div style="display:flex; align-items:flex-end; gap:4px; height:150px; padding:6px 0">
      ${buckets.map(b => `
        <div style="flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%"
             title="${b.from.toFixed(1)}s ~ ${b.to.toFixed(1)}s：${b.count} 次">
          <div style="width:100%; background:linear-gradient(180deg,#4da3ff,#2b6cb0); border-radius:3px 3px 0 0; height:${Math.max(2, b.count/maxCount*100)}%"></div>
        </div>`).join("")}
    </div>
    <div class="row muted" style="justify-content:space-between; font-size:11px">
      <span class="muted">${buckets[0] ? fmtSec(buckets[0].from) : ""}</span>
      <span class="muted">${buckets[buckets.length-1] ? fmtSec(buckets[buckets.length-1].to) : ""}</span>
    </div>
  </div>

  <div class="card">
    <h3>每次游玩明细 <small>最近 ${runs.length} 次</small></h3>
    <div class="scroll"><table>
      <thead><tr>
        <th>时间</th><th>结果</th><th class="num">时长</th><th class="num">死亡</th>
        <th class="num">跳跃</th><th class="num">位移</th><th class="num">第几次进入</th>
      </tr></thead>
      <tbody>${runs.map(r => `
        <tr>
          <td title="${esc(fmtTime(r.ts))}">${esc(fmtAgo(r.ts))}</td>
          <td><span class="badge ${r.type === "level_clear" ? "clear" : "quit"}">${r.type === "level_clear" ? "通关" : "中断"}</span></td>
          <td class="num">${fmtSec(r.duration_s)}</td>
          <td class="num">${r.deaths}</td>
          <td class="num">${r.jumps}</td>
          <td class="num">${r.distance}</td>
          <td class="num">${r.attempt}</td>
        </tr>`).join("")}</tbody>
    </table></div>
  </div>`;
}

function histogram(values, n) {
  if (!values.length) return [];
  const min = Math.min(...values), max = Math.max(...values);
  const span = Math.max(max - min, 0.001);
  const step = span / n;
  const out = [];
  for (let i = 0; i < n; i++) out.push({ from: min + i*step, to: min + (i+1)*step, count: 0 });
  for (const v of values) {
    let i = Math.floor((v - min) / step);
    if (i >= n) i = n - 1;
    if (i < 0) i = 0;
    out[i].count++;
  }
  return out;
}

/* ---------------------------------------------------------------- 最近事件 */

async function viewRecent() {
  const c = $("content");
  c.innerHTML = `<div class="card"><div class="muted">加载中…</div></div>`;
  try {
    const data = await api("/v1/stats/recent", { since: sinceMs(), limit: 80 });
    const events = data.events || [];
    if (!events.length) {
      c.innerHTML = `<div class="card"><div class="empty">这段时间没有事件。<br>
        <span class="muted">说明客户端还没上报，检查游戏是否进过 Play、endpoint 是否填对。</span></div></div>`;
      return;
    }
    c.innerHTML = `
    <div class="card">
      <h3>最近事件 <small>最新的 ${events.length} 条，用来确认数据真的在进来</small></h3>
      <div class="scroll"><table>
        <thead><tr><th>时间</th><th>类型</th><th>场景</th><th>摘要</th><th>会话</th></tr></thead>
        <tbody>${events.map(e => `
          <tr>
            <td title="${esc(fmtTime(e.ts))}">${esc(fmtAgo(e.ts))}</td>
            <td>${badge(e.type)}</td>
            <td>${esc(e.meta && e.meta.scene || "")}</td>
            <td>${esc(summary(e))}</td>
            <td class="muted" style="font-size:11px">${esc((e.session_id||"").slice(-8))}</td>
          </tr>`).join("")}</tbody>
      </table></div>
    </div>`;
  } catch (err) {
    c.innerHTML = `<div class="card"><div class="empty">读取失败：${esc(err.message)}</div></div>`;
  }
}

function badge(type) {
  const map = {
    death: ["death", "死亡"],
    level_clear: ["clear", "通关"],
    level_quit: ["quit", "中断"],
    level_start: ["start", "进入"],
    session_start: ["session", "启动"],
  };
  const [cls, label] = map[type] || ["", type];
  return `<span class="badge ${cls}">${esc(label)}</span>`;
}

function summary(e) {
  const m = e.meta || {};
  if (e.type === "death") {
    return `${m.cause || "?"} @(${Number(m.x||0).toFixed(1)}, ${Number(m.y||0).toFixed(1)}) 活了 ${Number(m.survived_s||0).toFixed(1)}s`;
  }
  if (e.type === "level_start") return `第 ${m.attempt} 次进入`;
  if (e.type === "level_clear") return `用时 ${fmtSec(m.duration_s)} · 死 ${m.deaths} 次`;
  if (e.type === "level_quit") return `中断 · 用时 ${fmtSec(m.duration_s)} · 死 ${m.deaths} 次`;
  if (e.type === "session_start") return `${m.platform || ""} · v${m.app_version || "?"}`;
  return "";
}

      <tr><td>cause</td><td>死因：<code>hazard:物体名</code> / <code>crush</code>（被夹）/ <code>manual_r</code>（自己按 R）</td></tr>
      <tr><td>actor</td><td><code>player1</code> 或 <code>player2</code>（P2 模仿 P1，能看出是不是影子害的）</td></tr>
      <tr><td>x / y</td><td>死亡瞬间的真实世界坐标（传送回出生点之前取的）</td></tr>
      <tr><td>cell_x / cell_y</td><td>同一个位置的格子编号，热力图用</td></tr>
      <tr><td>survived_s</td><td>这次进关到死亡撑了多久</td></tr>
      <tr><td>deaths_in_level</td><td>本关累计第几次死</td></tr>
      <tr><td>jumps_before_death</td><td>死前跳了多少次（判断是不是被跳跃卡住）</td></tr>
    </tbody></table>

    <h4>cell —— 每 1×1 世界单位格子的增量（每 60 秒或关卡结束上报）</h4>
    <table><tbody>
      <tr><td>cell_x / cell_y</td><td>格子坐标；x/y 是格子中心</td></tr>
      <tr><td>dwell_s</td><td>在这个格子里待了多少秒</td></tr>
      <tr><td>idle_s</td><td>其中完全没操作（没推方向、没按跳/下/冲刺）的时间</td></tr>
      <tr><td>jumps</td><td>在这个格子里成功起跳次数</td></tr>
      <tr><td>jump_fails</td><td>站在地上按了空格却没跳成（冷却/爬梯/下穿中）</td></tr>
    </tbody></table>

    <h4>level_clear / level_quit —— 关卡结束</h4>
    <table><tbody>
      <tr><td>duration_s</td><td>这一关待了多久</td></tr>
      <tr><td>deaths / jumps / jump_fails</td><td>本关累计</td></tr>
      <tr><td>distance</td><td>水平移动距离（会剔除传送造成的跳变）</td></tr>
      <tr><td>session_time_s</td><td>离开时距离启动过了多久</td></tr>
    </tbody></table>

    <h4>能回答的问题</h4>
    <div class="hint" style="line-height:2">
      · 哪一关死亡率最高、平均卡多久 → 关卡对比<br>
      · 具体哪个位置死得最多（墙上某一段、某个尖刺） → 热力图切「死亡次数」<br>
      · 在哪按空格最频繁、按了却跳不起来 → 热力图切「跳跃次数 / 跳跃失败率」<br>
      · 玩家在哪站着不动、发呆多久（迷路 / 找不到下一步） → 热力图切「停留 / 发呆时长」<br>
      · 一关的时长分布、有多少人中途退出 → 时长与通关<br>
      · 是不是被 P2（影子）挤死的 → 死亡流水里的角色列
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- 启动 */

/** 把当前视图写回地址栏：这样"9101 的跳跃热力图"可以复制链接发给别人 */
function syncUrl() {
  const u = new URL(location.href);
  u.searchParams.set("tab", state.tab);
  u.searchParams.set("metric", state.metric);
  u.searchParams.set("range", state.range);
  if (state.scene) u.searchParams.set("scene", state.scene);
  history.replaceState(null, "", u);
}

function bindHeader() {
  $("range").value = state.range;
  $("range").addEventListener("change", (e) => { state.range = e.target.value; syncUrl(); loadAll(); });
  $("refresh").addEventListener("click", () => loadAll());

  $("auto").addEventListener("change", (e) => {
    if (state.autoTimer) { clearInterval(state.autoTimer); state.autoTimer = null; }
    if (e.target.checked) state.autoTimer = setInterval(() => loadAll(), 60000);
  });

  $("cfgBtn").addEventListener("click", () => {
    const box = $("cfg");
    const show = box.style.display === "none";
    box.style.display = show ? "block" : "none";
    if (show) {
      $("cfgApi").value = state.api;
      $("cfgKey").value = state.key;
    }
  });

  $("cfgSave").addEventListener("click", () => {
    state.api = $("cfgApi").value.trim().replace(/\/+$/, "") || FALLBACK_API;
    state.key = $("cfgKey").value.trim();
    localStorage.setItem("alittle_api", state.api);
    localStorage.setItem("alittle_key", state.key);
    $("cfg").style.display = "none";
    loadAll();
  });
}

bindHeader();
loadAll();
</script>
